body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 80; background: var(--ds-navy); }
html.ds-lock { overflow: hidden; }

.ds-root { min-height: 100vh; font-family: var(--ds-font); }

.ds-strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--ds-h); display: flex; align-items: center; gap: 10px; box-sizing: border-box;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--ds-navy); color: #dfe5f7; font-size: 12.5px; font-weight: 600; line-height: 1; }
.ds-badge { flex: none; background: var(--ds-gold); color: var(--ds-navy); border-radius: 4px; padding: 4px 7px 3px; font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.ds-strip-text { min-width: 0; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c3cbe6; }
.ds-short { display: none; }
.ds-strip-actions { flex: none; display: flex; align-items: center; gap: 6px; }
.ds-chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid rgba(226, 192, 110, .5); background: transparent; color: #f3e6bd; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.ds-chip::after { content: ""; position: absolute; inset: -5px -2px; }
.ds-chip:hover { background: rgba(226, 192, 110, .14); }
.ds-chip-main { background: var(--ds-gold); border-color: var(--ds-gold); color: var(--ds-navy); }
.ds-chip-main:hover { background: #ecd08c; }
.ds-chip:focus-visible, .ds-x:focus-visible, .ds-tab:focus-visible, .ds-star:focus-visible, .ds-btn:focus-visible { outline: 2px solid #f3e6bd; outline-offset: 2px; }
.ds-narrow { display: none; }

.ds-app header.sticky { top: calc(var(--ds-h) + env(safe-area-inset-top, 0px)) !important; }
@media (min-width: 1024px) { .ds-app aside.sticky { top: calc(9rem + var(--ds-h)) !important; } }

@media (max-width: 719px) { .ds-long { display: none; } .ds-short { display: inline; } }
@media (max-width: 419px) { .ds-wide { display: none; } .ds-narrow { display: inline; } .ds-strip { gap: 8px; } .ds-chip { padding: 0 8px; } }
@media (max-width: 349px) { .ds-strip-text { display: none; } .ds-strip-actions { margin-left: auto; } }

/* Tiroir */
.ds-layer { position: fixed; inset: 0; z-index: 60; font-family: var(--ds-font); }
.ds-scrim { position: absolute; inset: 0; background: rgba(11, 16, 32, .56); }
.ds-drawer { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; background: var(--ds-paper); color: var(--ds-ink); border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(11, 16, 32, .35); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 720px) { .ds-drawer { left: auto; top: 0; bottom: 0; width: min(460px, 100%); max-height: none; border-radius: 0; box-shadow: -12px 0 40px rgba(11, 16, 32, .3); padding-bottom: 0; } }
@media (prefers-reduced-motion: no-preference) {
  .ds-drawer { animation: ds-up 220ms ease-out both; }
  @keyframes ds-up { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (min-width: 720px) { .ds-drawer { animation-name: ds-in; } @keyframes ds-in { from { transform: translateX(14px); opacity: 0; } to { transform: none; opacity: 1; } } }
}
.ds-drawer-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.ds-drawer-head h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.ds-x { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: var(--ds-muted); cursor: pointer; }
.ds-x:hover { background: var(--ds-wash); color: var(--ds-ink); }
.ds-x:focus-visible, .ds-tab:focus-visible, .ds-star:focus-visible, .ds-btn:focus-visible { outline-color: var(--ds-gold-deep); }
.ds-tabs { flex: none; display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--ds-line); padding: 0 max(8px, env(safe-area-inset-left, 0px)); }
.ds-tab { flex: none; border: 0; background: transparent; padding: 12px 12px 11px; font: inherit; font-size: 14px; font-weight: 700; color: var(--ds-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.ds-tab.is-on { color: var(--ds-ink); border-bottom-color: var(--ds-gold-deep); }
.ds-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); font-size: 14.5px; line-height: 1.55; }
.ds-body h3 { margin: 22px 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ds-muted); }
.ds-body h3:first-child { margin-top: 4px; }
.ds-body p { margin: 0 0 10px; }
.ds-lead { font-size: 15px; color: var(--ds-ink); }

/* Formulaire */
.ds-form { display: flex; flex-direction: column; gap: 14px; }
.ds-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ds-field label, .ds-label { font-size: 13px; font-weight: 700; color: var(--ds-ink); }
.ds-opt { font-weight: 500; color: var(--ds-muted); }
.ds-form input[type="text"], .ds-form select, .ds-form textarea { width: 100%; box-sizing: border-box; border: 1px solid #b8c2d1; border-radius: 10px; background: var(--ds-paper); color: var(--ds-ink); padding: 10px 12px; font: inherit; font-size: 16px; line-height: 1.4; }
.ds-form textarea { resize: vertical; min-height: 84px; }
.ds-form input:focus, .ds-form select:focus, .ds-form textarea:focus { outline: 2px solid var(--ds-gold-deep); outline-offset: 1px; border-color: var(--ds-gold-deep); }
.ds-form textarea[readonly] { background: var(--ds-wash); font-size: 14px; }
.ds-stars { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.ds-star { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #64748b; cursor: pointer; }
.ds-star svg { fill: none; }
.ds-star.is-on { color: #b7791f; }
.ds-star.is-on svg { fill: currentColor; }
.ds-star:hover { background: var(--ds-wash); }
.ds-star-label { margin-left: 8px; font-size: 13.5px; font-weight: 700; color: var(--ds-muted); }
.ds-note { border-radius: 8px; background: var(--ds-wash); color: var(--ds-muted); padding: 9px 11px; font-size: 13px; line-height: 1.45; margin: 0; }
.ds-note-warn { background: var(--ds-warn-bg); color: var(--ds-warn); }
.ds-error { display: flex; align-items: flex-start; gap: 8px; border-radius: 8px; background: var(--ds-bad-bg); color: var(--ds-bad); padding: 9px 11px; font-size: 13.5px; font-weight: 600; line-height: 1.45; margin: 0; }
.ds-error svg { flex: none; margin-top: 2px; }
.ds-row { display: flex; flex-wrap: wrap; gap: 8px; }
.ds-manual { display: flex; flex-direction: column; gap: 8px; }
.ds-btn { box-sizing: border-box; min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; border: 1px solid transparent; font: inherit; font-size: 14.5px; font-weight: 700; text-decoration: none; cursor: pointer; }
.ds-btn-primary { background: var(--ds-navy); color: #fff; }
.ds-btn-primary:hover { background: var(--ds-navy-2); }
.ds-btn-line { background: var(--ds-paper); color: var(--ds-ink); border-color: #b8c2d1; }
.ds-btn-line:hover { background: var(--ds-wash); }
.ds-btn-danger { background: var(--ds-bad); color: #fff; }
.ds-btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.ds-btn:disabled, .ds-btn.is-disabled { opacity: .45; cursor: not-allowed; }
.ds-form > .ds-btn-primary { width: 100%; }

.ds-done { text-align: center; padding: 18px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ds-done h3 { margin: 10px 0 0; font-size: 19px; letter-spacing: -.01em; text-transform: none; color: var(--ds-ink); }
.ds-done p { margin: 0 0 12px; color: var(--ds-muted); }
.ds-done-mark { width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--ds-ok-bg); color: var(--ds-ok); }

/* Guide */
.ds-steps, .ds-list { margin: 0 0 6px; padding-left: 1.4rem; }
.ds-steps { list-style: decimal outside; }
.ds-list { list-style: disc outside; }
.ds-steps li::marker { font-weight: 800; color: var(--ds-gold-deep); }
.ds-steps li, .ds-list li { margin-bottom: 8px; padding-left: 2px; }
.ds-confirm { border: 1px solid var(--ds-line); border-radius: 10px; padding: 12px; background: var(--ds-bad-bg); }
.ds-confirm p { color: var(--ds-bad); font-weight: 600; }

/* Avis reçus */
.ds-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: 4px 0 12px; font-size: 14px; }
.ds-summary .ds-btn { margin-left: auto; }
.ds-cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ds-card { border: 1px solid var(--ds-line); border-radius: 10px; padding: 11px 12px; background: var(--ds-paper); min-width: 0; overflow-wrap: anywhere; }
.ds-card p { margin: 6px 0 0; font-size: 14px; }
.ds-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ds-card-stars { color: #b7791f; letter-spacing: .08em; font-size: 15px; }
.ds-card-who { font-weight: 800; }
.ds-card-meta { font-size: 12px; color: var(--ds-muted); margin-top: 2px; }
.ds-empty { display: flex; flex-direction: column; gap: 4px; border: 1px dashed #b8c2d1; border-radius: 10px; padding: 16px; color: var(--ds-muted); }
.ds-empty b { color: var(--ds-ink); }

.ds-reset { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(11, 16, 32, .92); color: #fff; text-align: center; padding: 24px; font-family: var(--ds-font); }
.ds-reset p { margin: 0; font-size: 16px; font-weight: 700; }
.ds-reset .ds-btn-primary { background: var(--ds-gold); color: var(--ds-navy); }

@media print { .ds-strip, .ds-layer, .ds-reset { display: none !important; } }

.inv-focus:focus-visible { outline: 2px solid #0f172a; outline-offset: 2px; }
@media (max-width: 359px) { .inv-narrow-hide { display: none !important; } }
@media (max-width: 399px) { .inv-brand-word { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; } }
@keyframes invRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes invFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes invToast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.inv-rsvp:hover { filter: brightness(1.08); transform: translateY(-1px); }
.inv-rsvp:active { transform: scale(.97); }
.inv-rsvp:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.print-only { display: none; }

@keyframes invShakeA { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
@keyframes invShakeB { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
.inv-swatch { transition: transform 220ms cubic-bezier(.3,1.6,.5,1), outline-color 300ms ease; }
.inv-swatch:hover { transform: scale(1.14); }
.inv-swatch:active { transform: scale(.95); }
.inv-swatch:focus-visible { outline-color: currentColor !important; }
.inv-chip { transition: background-color 200ms ease, transform 200ms ease, border-color 700ms ease, color 700ms ease; }
.inv-chip:hover { background-color: rgba(127,127,127,.16); transform: translateY(-1px); }
.inv-chip:active { transform: scale(.97); }
.inv-chip:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@keyframes invSheet { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
@keyframes invPop { 0% { opacity: 0; transform: scale(.4); } 100% { opacity: 1; transform: scale(1); } }
@keyframes invBurst { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.5); } }

}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

@page qr { size: A4 portrait; margin: 10mm; }
@media print {
  .qr-print-root > :not(.qr-sheet) { display: none !important; }
  body[data-print="qr"] .inv-ui > :not(.qr-print-root) { display: none !important; }
  body[data-print="qr"] .inv-ui { background: #fff !important; min-height: 0 !important; }
  body[data-print="qr"] .qr-print-root { padding: 0 !important; max-width: none !important; }
  body[data-print="qr"] .qr-sheet { display: block !important; page: qr; }
}
@media print {
  @page { size: A5 portrait; margin: 0; }
  html, body { background: #fff !important; }
  .no-print { display: none !important; }
  .print-only { display: block !important; }
  .inv-aside { max-height: none !important; overflow: visible !important; }
  .print-flat {
    display: block !important; position: static !important; width: auto !important; max-width: none !important;
    min-height: 0 !important; margin: 0 !important; padding: 0 !important; border: 0 !important;

  #invitation-card[data-format="vip"] { width: 105mm !important; }

  .print-flat { filter: none !important; }

    -webkit-print-color-adjust: exact; print-color-adjust: exact; animation: none !important;
  }
}
